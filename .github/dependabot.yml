# Monthly dependency-update pull requests (security fixes arrive as soon as published).
# Each update is tested by the MRI Suite CI workflow before anyone merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/mri-suite
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
