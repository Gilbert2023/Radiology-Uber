# Runs on every push / pull request that touches the MRI Suite.
# Vercel only deploys code; this workflow proves it still works before it reaches the hospital.
name: MRI Suite CI

# Runs on every pull request (no path filter) so it can be a required check on `main`:
# a required check that never runs would block unrelated pull requests forever.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: MRI Suite tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mri-suite
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mri
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: mri_suite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mri" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mri:ci_password@localhost:5432/mri_suite_test
      TEST_DATABASE_URL: postgres://mri:ci_password@localhost:5432/mri_suite_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mri-suite/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
